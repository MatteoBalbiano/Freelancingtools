<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/styles/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="./assets/js/config.js" defer></script>
    <script src="./assets/js/main.js" defer></script>
    <title>Portfolio</title>
</head>
<body>
    <div class="landing-page">
        <header>
            <nav class="navbar-top">
                <div class="navbar-top-content">
                    <h3 class="sub-headline grey-text"></h3>
                </div>
            </nav>
        </header>
        <main class="fade">
            <section>
                <div class="main-content">
                    <h1 class="main-headline"></h1>
                    <div class="word-slider"></div>
                </div>
            </section>
            <section>
                <div class="skill-list"></div>
            </section>
        </main>
        <footer>
            <div class="end-link-list">
                <h3 class="sub-headline grey-text">
                    <a href="#" id="email-link">
                        <div class="icon-text">
                            <i class="fa-regular fa-envelope"></i> E-MAIL
                        </div>
                    </a>
                </h3>
                <h3 class="sub-headline grey-text">
                    <a href="#" id="linkedin-link" target="_blank">
                        <div class="icon-text">
                            <i class="fa-brands fa-linkedin-in"></i> LINKEDIN
                        </div>
                    </a>
                </h3>
                <h3 class="sub-headline grey-text">
                    <a href="#" id="github-link" target="_blank">
                        <div class="icon-text">
                            <i class="fa-brands fa-github"></i> GITHUB
                        </div>
                    </a>
                </h3>
            </div>
        </footer>
    </div>
</body>
</html>
